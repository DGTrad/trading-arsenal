<script>
function cvs(candles){return candles.map(c=>{const cls=c.t==='bull'?'cd-bull':c.t==='bear'?'cd-bear':'cd-doji';return`<div class="cd ${cls}"><div class="cd-wick" style="height:${c.wu}px"></div><div class="cd-body" style="height:${c.b}px"></div><div class="cd-wick" style="height:${c.wd}px"></div></div>`}).join('')}

const L=[
{id:1,t:'Anatomía de las Velas',s:'Cuerpo, mechas y lo que significan',c:`
<div class="cb"><p>Antes de estudiar patrones, debes entender perfectamente cada parte de una vela y qué historia cuenta sobre la batalla entre compradores y vendedores.</p></div>
<div class="vbox"><div class="vbox-tag">Estructura de una vela</div>
<div class="candle-display"><div style="text-align:center"><div class="cd cd-bull"><div class="cd-wick" style="height:20px"></div><div class="cd-body" style="height:50px"></div><div class="cd-wick" style="height:30px"></div></div><div style="font-size:11px;color:var(--green);margin-top:8px;font-weight:600">Alcista</div></div>
<div style="width:1px;height:80px;background:var(--border-2);margin:0 20px"></div>
<div style="text-align:center"><div class="cd cd-bear"><div class="cd-wick" style="height:30px"></div><div class="cd-body" style="height:50px"></div><div class="cd-wick" style="height:20px"></div></div><div style="font-size:11px;color:var(--red);margin-top:8px;font-weight:600">Bajista</div></div></div></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-title">Cuerpo grande</div><div class="info-desc">Fuerte decisión del mercado en una dirección</div></div>
<div class="info-card" style="border-top:3px solid var(--text-3)"><div class="info-title">Cuerpo pequeño</div><div class="info-desc">Indecisión, equilibrio entre compradores y vendedores</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-title">Mecha inferior larga</div><div class="info-desc">Vendedores intentaron bajar pero fueron rechazados</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-title">Mecha superior larga</div><div class="info-desc">Compradores intentaron subir pero fueron rechazados</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 La mecha cuenta la historia oculta</div><p>El cuerpo te dice quién ganó. Las mechas te dicen <strong>quién intentó ganar y fracasó</strong>. Una mecha inferior larga en un soporte = rechazo fuerte = señal alcista.</p></div>
`,q:{q:'¿Qué indica una mecha inferior muy larga?',o:['Presión compradora fuerte','Los vendedores dominaron','Indecisión del mercado','Bajo volumen'],a:0}},

{id:2,t:'Doji',s:'La vela de la indecisión',c:`
<div class="cb"><p>El Doji se forma cuando apertura y cierre son prácticamente iguales. El cuerpo es mínimo. Indica <strong>indecisión total</strong> entre compradores y vendedores.</p></div>
<div class="vbox"><div class="vbox-tag">Tipos de Doji</div>
<div class="candle-display">
<div style="text-align:center"><div class="cd cd-doji"><div class="cd-wick" style="height:30px"></div><div class="cd-body" style="height:2px"></div><div class="cd-wick" style="height:30px"></div></div><div style="font-size:10px;color:var(--text-3);margin-top:8px">Doji estándar</div></div>
<div style="text-align:center"><div class="cd cd-doji"><div class="cd-wick" style="height:40px"></div><div class="cd-body" style="height:2px"></div><div class="cd-wick" style="height:5px"></div></div><div style="font-size:10px;color:var(--text-3);margin-top:8px">Lápida</div></div>
<div style="text-align:center"><div class="cd cd-doji"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:2px"></div><div class="cd-wick" style="height:40px"></div></div><div style="font-size:10px;color:var(--text-3);margin-top:8px">Libélula</div></div>
</div></div>
<div class="cbox"><div class="cbox-label">💡 Cuándo importa un Doji</div><p>Un Doji en mitad de un rango lateral no dice nada. Pero un Doji <strong>en un extremo</strong> (resistencia o soporte) puede señalar una reversión importante. Siempre confirma con la vela siguiente.</p></div>
<span class="signal-tag sig-neutral">● Neutral / Reversión potencial</span>
`,q:{q:'¿Cuándo es más significativo un Doji?',o:['En mitad de un rango','En zona de soporte o resistencia','Siempre es importante','Nunca es importante'],a:1}},

{id:3,t:'Hammer y Hanging Man',s:'Misma forma, diferente contexto',c:`
<div class="vbox"><div class="vbox-tag">Hammer (Martillo) — Señal alcista</div>
<div class="candle-display"><div class="cd cd-bull"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:15px"></div><div class="cd-wick" style="height:40px"></div></div></div>
<p>Aparece en tendencia bajista. Mecha inferior larga (≥2x cuerpo). Los vendedores empujaron abajo pero los compradores los rechazaron con fuerza.</p></div>
<div class="vbox"><div class="vbox-tag">Hanging Man — Señal bajista</div>
<div class="candle-display"><div class="cd cd-bear"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:15px"></div><div class="cd-wick" style="height:40px"></div></div></div>
<p>Misma forma que el Hammer pero aparece en tendencia alcista. Indica que los vendedores empiezan a tomar control.</p></div>
<div class="cbox"><div class="cbox-label">💡 El contexto lo es todo</div><p>Misma vela, significado opuesto. El <strong>Hammer</strong> en soporte = compra. El <strong>Hanging Man</strong> en resistencia = precaución. El patrón sin contexto no tiene valor.</p></div>
<span class="signal-tag sig-bull">● Hammer: Alcista en soportes</span>
`,q:{q:'¿Qué diferencia un Hammer de un Hanging Man?',o:['El color de la vela','El tamaño de la mecha','El contexto: tendencia bajista vs alcista','Nada, son iguales'],a:2}},

{id:4,t:'Shooting Star e Inverted Hammer',s:'Rechazo por arriba',c:`
<div class="vbox"><div class="vbox-tag">Shooting Star — Señal bajista</div>
<div class="candle-display"><div class="cd cd-bear"><div class="cd-wick" style="height:40px"></div><div class="cd-body" style="height:15px"></div><div class="cd-wick" style="height:5px"></div></div></div>
<p>Aparece en tendencia alcista. Mecha superior larga. Los compradores intentaron subir pero los vendedores los rechazaron con fuerza. Señal de posible techo.</p></div>
<div class="vbox"><div class="vbox-tag">Inverted Hammer — Señal alcista</div>
<div class="candle-display"><div class="cd cd-bull"><div class="cd-wick" style="height:40px"></div><div class="cd-body" style="height:15px"></div><div class="cd-wick" style="height:5px"></div></div></div>
<p>Aparece en tendencia bajista. Los compradores intentan tomar control. Necesita confirmación con la siguiente vela.</p></div>
<div class="ebox"><div class="ebox-label">📌 Regla práctica</div><p>La mecha debe ser al menos <strong>2 veces</strong> el tamaño del cuerpo. Sin esta proporción, el patrón no es válido.</p></div>
<span class="signal-tag sig-bear">● Shooting Star: Bajista en resistencias</span>
`,q:{q:'¿Qué indica un Shooting Star?',o:['Continuación alcista','Rechazo en una zona alta, posible caída','Indecisión','Acumulación'],a:1}},

{id:5,t:'Engulfing (Envolvente)',s:'El patrón de reversión más poderoso',c:`
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)">
<div class="info-title">Engulfing Alcista</div>
<div class="candle-display" style="height:80px"><div class="cd cd-bear"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:20px"></div><div class="cd-wick" style="height:5px"></div></div><div class="cd cd-bull"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:40px"></div><div class="cd-wick" style="height:3px"></div></div></div>
<div class="info-desc">Vela verde envuelve completamente la roja anterior. Aparece en soportes.</div></div>
<div class="info-card" style="border-top:3px solid var(--red)">
<div class="info-title">Engulfing Bajista</div>
<div class="candle-display" style="height:80px"><div class="cd cd-bull"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:20px"></div><div class="cd-wick" style="height:5px"></div></div><div class="cd cd-bear"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:40px"></div><div class="cd-wick" style="height:3px"></div></div></div>
<div class="info-desc">Vela roja envuelve completamente la verde anterior. Aparece en resistencias.</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Por qué es tan potente</div><p>El Engulfing muestra un <strong>cambio completo de sentimiento</strong> en un solo período. La segunda vela literalmente "se come" a la primera, indicando que el bando contrario tomó control total.</p></div>
<div class="ebox"><div class="ebox-label">📌 Filtros de calidad</div><p>✅ Cuanto más grande la segunda vela, mejor<br>✅ Más fiable en zonas de S/R<br>✅ Volumen alto en la segunda vela = confirmación extra<br>❌ Ignora engulfings en mitad de un rango sin contexto</p></div>
`,q:{q:'¿Qué hace especial al Engulfing?',o:['Tiene 3 velas','La segunda vela envuelve completamente a la primera','Solo funciona en Forex','Necesita un indicador para confirmarse'],a:1}},

{id:6,t:'Morning Star y Evening Star',s:'Patrones de 3 velas de alta fiabilidad',c:`
<div class="vbox"><div class="vbox-tag">☀️ Morning Star (Estrella de la mañana) — Alcista</div>
<div class="candle-display"><div class="cd cd-bear"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:35px"></div><div class="cd-wick" style="height:4px"></div></div><div class="cd cd-doji"><div class="cd-wick" style="height:10px"></div><div class="cd-body" style="height:3px"></div><div class="cd-wick" style="height:10px"></div></div><div class="cd cd-bull"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:35px"></div><div class="cd-wick" style="height:4px"></div></div></div>
<p>Vela bajista grande → Doji/cuerpo pequeño (indecisión) → Vela alcista grande. Señal potente de reversión alcista.</p></div>
<div class="vbox"><div class="vbox-tag">🌙 Evening Star (Estrella vespertina) — Bajista</div>
<div class="candle-display"><div class="cd cd-bull"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:35px"></div><div class="cd-wick" style="height:4px"></div></div><div class="cd cd-doji"><div class="cd-wick" style="height:10px"></div><div class="cd-body" style="height:3px"></div><div class="cd-wick" style="height:10px"></div></div><div class="cd cd-bear"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:35px"></div><div class="cd-wick" style="height:4px"></div></div></div>
<p>Vela alcista grande → Doji/cuerpo pequeño → Vela bajista grande. Señal potente de reversión bajista.</p></div>
<div class="cbox"><div class="cbox-label">💡 La historia que cuentan</div><p><strong>Morning Star:</strong> Los vendedores dominan (vela 1) → Se agotan (vela 2, indecisión) → Los compradores toman control (vela 3).<br><br>Son patrones de <strong>alta fiabilidad</strong> especialmente en temporalidades H4 y superiores.</p></div>
`,q:{q:'¿Cuántas velas tiene un Morning Star?',o:['1','2','3','4'],a:2}},

{id:7,t:'Three White Soldiers / Three Black Crows',s:'La fuerza de la continuación',c:`
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-title">Three White Soldiers</div>
<div class="candle-display" style="height:90px"><div class="cd cd-bull"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:22px"></div><div class="cd-wick" style="height:3px"></div></div><div class="cd cd-bull"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:28px"></div><div class="cd-wick" style="height:3px"></div></div><div class="cd cd-bull"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:34px"></div><div class="cd-wick" style="height:3px"></div></div></div>
<div class="info-desc">3 velas alcistas con cierres progresivamente más altos. Fuerte señal alcista.</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-title">Three Black Crows</div>
<div class="candle-display" style="height:90px"><div class="cd cd-bear"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:34px"></div><div class="cd-wick" style="height:3px"></div></div><div class="cd cd-bear"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:28px"></div><div class="cd-wick" style="height:3px"></div></div><div class="cd cd-bear"><div class="cd-wick" style="height:3px"></div><div class="cd-body" style="height:22px"></div><div class="cd-wick" style="height:3px"></div></div></div>
<div class="info-desc">3 velas bajistas con cierres progresivamente más bajos. Fuerte señal bajista.</div></div>
</div>
<div class="wbox"><div class="wbox-label">⚠️ Cuidado con el agotamiento</div><p>Después de 3 velas fuertes en la misma dirección, el movimiento puede estar <strong>agotado</strong>. No entres tarde. Busca retrocesos para incorporarte al movimiento.</p></div>
`,q:{q:'¿Qué riesgo hay al ver Three White Soldiers?',o:['Ninguno, siempre es señal de compra','Posible agotamiento tras 3 velas consecutivas','Indica reversal','El mercado cerrará'],a:1}},

{id:8,t:'Harami',s:'La calma antes de la tormenta',c:`
<div class="vbox"><div class="vbox-tag">Harami (embarazada)</div>

<div style="text-align:center"><div class="cd cd-bear"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:40px"></div><div class="cd-wick" style="height:4px"></div></div><div class="cd cd-bull"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:14px"></div><div class="cd-wick" style="height:5px"></div></div><div style="font-size:10px;color:var(--green);margin-top:8px">Harami Alcista</div></div>
<div style="width:1px;height:60px;background:var(--border-2);margin:0 30px"></div>
<div style="text-align:center"><div class="cd cd-bull"><div class="cd-wick" style="height:4px"></div><div class="cd-body" style="height:40px"></div><div class="cd-wick" style="height:4px"></div></div><div class="cd cd-bear"><div class="cd-wick" style="height:5px"></div><div class="cd-body" style="height:14px"></div><div class="cd-wick" style="height:5px"></div></div><div style="font-size:10px;color:var(--red);margin-top:8px">Harami Bajista</div></div>
</div></div>
<div class="cbox"><div class="cbox-label">💡 Cómo leerlo</div><p>La segunda vela es <strong>pequeña y está contenida dentro</strong> del cuerpo de la primera. Indica que el impulso anterior se frena. Es como si la primera vela "embarazara" a la segunda. Menos fiable que el Engulfing pero útil como alerta temprana.</p></div>
`,q:{q:'¿Qué relación hay entre las velas del Harami?',o:['La segunda es más grande','La segunda está contenida dentro de la primera','Son iguales','La primera es muy pequeña'],a:1}},

{id:9,t:'Aplicación Práctica',s:'Cómo usar patrones en trading real',c:`
<div class="cb"><h3>Los 5 filtros del profesional</h3><p>Un patrón de velas por sí solo NO es señal de entrada. Necesitas contexto. Estos filtros separan las señales buenas de las falsas.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-icon">📍</div><div class="info-title">1. Ubicación</div><div class="info-desc">¿Está en un soporte o resistencia clave?</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📈</div><div class="info-title">2. Tendencia</div><div class="info-desc">¿El patrón va a favor de la tendencia mayor?</div></div>
<div class="info-card" style="border-top:3px solid var(--blue)"><div class="info-icon">📊</div><div class="info-title">3. Confluencia</div><div class="info-desc">¿Coincide con EMA, Fibonacci u otro indicador?</div></div>
<div class="info-card" style="border-top:3px solid var(--purple)"><div class="info-icon">⏱️</div><div class="info-title">4. Temporalidad</div><div class="info-desc">¿Está en H4 o superior? (más fiable)</div></div>
</div>
<div class="ebox"><div class="ebox-label">📌 Ejemplo completo</div><p><strong>Escenario:</strong> EUR/USD en D1. Tendencia alcista. Precio retrocede a soporte en 1.0800. La EMA 50 pasa por 1.0800. RSI en 42. Se forma un <strong>Hammer</strong> con mecha inferior larga.</p>
<p>✅ Ubicación: soporte<br>✅ Tendencia: alcista<br>✅ Confluencia: EMA 50 + soporte<br>✅ Temporalidad: D1<br><br><strong>Resultado: Setup de alta probabilidad para compra</strong></p></div>
<div class="wbox"><div class="wbox-label">⚠️ Error más común</div><p>Operar patrones de velas <strong>sin contexto</strong>. Un Hammer en mitad de la nada no vale nada. Un Hammer en un soporte con confluencia vale oro.</p></div>
`,q:{q:'¿Cuál es el filtro más importante para patrones?',o:['El color de la vela','Que sea en M1','La ubicación (soporte/resistencia)','Que el RSI esté en 50'],a:2}},

{id:10,t:'Resumen y Cheat Sheet',s:'Todos los patrones en una referencia rápida',c:`
<div class="cb"><h3>🎓 Resumen del curso</h3><p>Has aprendido los patrones de velas más importantes. Aquí tienes tu referencia rápida para consultar siempre que lo necesites.</p></div>
<div class="vbox"><div class="vbox-tag">Cheat Sheet — Patrones de Reversión</div>

let cur=0,done=new Set();
try{const s=localStorage.getItem('c-pv');if(s)done=new Set(JSON.parse(s))}catch(e){}
function renderSB(){const n=document.getElementById('sbNav');n.innerHTML=L.map((l,i)=>`<button class="sb-link ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="go(${i})"><span class="sb-num">${done.has(i)?'✓':l.id}</span><span>${l.t}</span></button>`).join('');document.getElementById('progText').textContent=done.size+'/'+L.length;document.getElementById('progFill').style.width=(done.size/L.length*100)+'%'}
function render(){const l=L[cur],m=document.getElementById('mainArea');let qh='';if(l.q)qh=`<div class="quiz-box"><div class="quiz-q">🧠 ${l.q.q}</div><div class="quiz-opts">${l.q.o.map((o,i)=>`<button class="qo" onclick="chk(${i},${l.q.a})">${o}</button>`).join('')}</div><div class="quiz-fb" id="qfb"></div></div>`;m.innerHTML=`<div class="lesson-tag">Lección ${l.id} de ${L.length}</div><h1 class="lesson-title">${l.t}</h1><p class="lesson-sub">${l.s}</p>${l.c}${qh}<div class="lesson-nav">${cur>0?`<button class="ln-btn ln-prev" onclick="go(${cur-1})">← Anterior</button>`:'<div></div>'}${cur<L.length-1?`<button class="ln-btn ln-next" onclick="cmpNext()">Completar y seguir →</button>`:`<button class="ln-btn ln-done" onclick="finish()">🎓 Completar curso</button>`}</div>`;m.scrollTo(0,0);window.scrollTo(0,0);renderSB();document.getElementById('sidebar').classList.remove('open');qAns=false}
let qAns=false;function chk(s,c){if(qAns)return;qAns=true;document.querySelectorAll('.qo').forEach((b,i)=>{if(i===c)b.classList.add('ok');else if(i===s&&s!==c)b.classList.add('no');b.style.cursor='default'});document.getElementById('qfb').innerHTML=s===c?'<span style="color:var(--green)">✅ ¡Correcto!</span>':'<span style="color:var(--red)">❌ Incorrecto</span>'}
function go(i){cur=i;render()}
function cmpNext(){done.add(cur);save();go(cur+1)}
function save(){try{localStorage.setItem('c-pv',JSON.stringify([...done]))}catch(e){}}
function finish(){done.add(cur);save();document.getElementById('mainArea').innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:72px;margin-bottom:16px">🕯️</div><h1 style="font-size:30px;font-weight:900;margin-bottom:10px">¡Curso Completado!</h1><p style="font-size:16px;color:var(--text-2)">Has dominado los patrones de velas japonesas</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px"><a href="../../index.html" class="ln-btn ln-next" style="text-decoration:none;display:inline-block">Herramientas →</a><a href="../cursos.html" class="ln-btn ln-prev" style="text-decoration:none;display:inline-block">Más cursos</a></div></div>`;renderSB()}
render();
</script>

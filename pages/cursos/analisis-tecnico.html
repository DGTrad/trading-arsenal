<script>
const L=[
// ===== LESSON 1 =====
{id:1,t:'¿Qué es el Análisis Técnico?',s:'Fundamentos, filosofía y los 3 pilares',c:`
<div class="cb"><h3>Definición</h3><p>El análisis técnico es el estudio del <strong>movimiento del precio</strong> a través de gráficos para identificar oportunidades de trading. No se preocupa por el "porqué" sino por el "qué" y el "cuándo".</p></div>
<div class="info-grid info-grid-3">
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-icon">📊</div><div class="info-title">El precio lo descuenta todo</div><div class="info-desc">Toda la información ya está reflejada en el precio</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📈</div><div class="info-title">El precio se mueve en tendencias</div><div class="info-desc">Una tendencia tiene más probabilidad de continuar que de revertir</div></div>
<div class="info-card" style="border-top:3px solid var(--blue)"><div class="info-icon">🔄</div><div class="info-title">La historia se repite</div><div class="info-desc">Los patrones se repiten porque la psicología humana no cambia</div></div>
</div>
<div class="vbox"><div class="vbox-tag">Análisis Técnico vs Fundamental</div>
<table class="ctable"><tr><th>Aspecto</th><th>Técnico</th><th>Fundamental</th></tr>
<tr><td>Enfoque</td><td>Gráficos y precio</td><td>Datos económicos</td></tr>
<tr><td>Horizonte</td><td>Corto-medio plazo</td><td>Medio-largo plazo</td></tr>
<tr><td>Pregunta clave</td><td>¿Cuándo operar?</td><td>¿Qué operar?</td></tr></table></div>
<div class="ebox"><div class="ebox-label">📌 Ejemplo práctico</div><p>EUR/USD sube 3 semanas. El fundamental dice "sube porque el BCE subió tipos". El técnico dice "hay tendencia alcista con máximos crecientes — busco compras en retrocesos".</p><p><strong>El fundamental te dice el porqué. El técnico te dice el cuándo.</strong></p></div>
`,q:{q:'¿Cuál es el primer pilar del análisis técnico?',o:['El precio se mueve en tendencias','La historia se repite','El precio lo descuenta todo','Los indicadores predicen el futuro'],a:2}},

// ===== LESSON 2 =====
{id:2,t:'Tipos de Gráficos',s:'Líneas, barras y velas japonesas',c:`
<div class="cb"><p>Existen tres formas de representar el precio. Cada una muestra diferente cantidad de información.</p></div>
<div class="vbox"><div class="vbox-tag">Gráfico de líneas</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,85 50,70 90,55 130,60 170,40 210,45 250,25 290,35 330,15 370,30" fill="none" stroke="#d4a843" stroke-width="2.5"/></svg>
<p>Solo muestra el precio de cierre. Simple pero pierde información.</p></div>
<div class="vbox"><div class="vbox-tag">Velas japonesas — el estándar profesional</div>
<svg width="100%" height="120" viewBox="0 0 400 120">
<line x1="40" y1="20" x2="40" y2="90" stroke="#5a5a6e" stroke-width="1.5"/><rect x="32" y="35" width="16" height="40" rx="1" fill="#2ecc71"/>
<line x1="100" y1="25" x2="100" y2="95" stroke="#5a5a6e" stroke-width="1.5"/><rect x="92" y="40" width="16" height="35" rx="1" fill="#e74c3c"/>
<line x1="160" y1="30" x2="160" y2="85" stroke="#5a5a6e" stroke-width="1.5"/><rect x="152" y="38" width="16" height="30" rx="1" fill="#2ecc71"/>
<line x1="220" y1="20" x2="220" y2="80" stroke="#5a5a6e" stroke-width="1.5"/><rect x="212" y="30" width="16" height="38" rx="1" fill="#2ecc71"/>
<line x1="280" y1="35" x2="280" y2="100" stroke="#5a5a6e" stroke-width="1.5"/><rect x="272" y="50" width="16" height="30" rx="1" fill="#e74c3c"/>
<line x1="340" y1="25" x2="340" y2="88" stroke="#5a5a6e" stroke-width="1.5"/><rect x="332" y="35" width="16" height="38" rx="1" fill="#2ecc71"/>
</svg>
<p>Cada vela muestra 4 datos: apertura, cierre, máximo y mínimo.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">🟩</div><div class="info-title">Vela Alcista</div><div class="info-desc">Cierre > Apertura. Los compradores ganaron.</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-icon">🟥</div><div class="info-title">Vela Bajista</div><div class="info-desc">Cierre < Apertura. Los vendedores ganaron.</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Anatomía de una vela</div><p><strong>Cuerpo</strong> = distancia apertura-cierre. Grande → decisión. Pequeño → indecisión.<br><strong>Mechas</strong> = las líneas finas. Superior → rechazo de compradores. Inferior → rechazo de vendedores.</p></div>
`,q:{q:'¿Qué datos muestra una vela japonesa?',o:['Solo apertura y cierre','Apertura, cierre, máximo y mínimo','Solo máximo y mínimo','Volumen y precio'],a:1}},

// ===== LESSON 3 =====
{id:3,t:'Tendencias del Mercado',s:'Alcista, bajista y lateral — cómo identificarlas',c:`
<div class="cb"><p>Una tendencia es la <strong>dirección general</strong> del precio. Identificarla es lo primero antes de cualquier decisión.</p></div>
<div class="vbox"><div class="vbox-tag">⬆️ Tendencia Alcista</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,90 50,75 70,80 110,60 130,68 170,45 190,52 230,30 270,38 330,15" fill="none" stroke="#2ecc71" stroke-width="2.5"/><line x1="10" y1="90" x2="330" y2="30" stroke="#2ecc71" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/></svg>
<p>Máximos y mínimos <strong style="color:var(--green)">CRECIENTES</strong> ↗</p></div>
<div class="vbox"><div class="vbox-tag">⬇️ Tendencia Bajista</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,15 50,30 70,22 110,45 130,38 170,55 190,48 230,70 270,62 330,85" fill="none" stroke="#e74c3c" stroke-width="2.5"/><line x1="10" y1="15" x2="330" y2="70" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/></svg>
<p>Máximos y mínimos <strong style="color:var(--red)">DECRECIENTES</strong> ↘</p></div>
<div class="vbox"><div class="vbox-tag">↔️ Rango Lateral</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,50 50,35 90,55 130,32 170,58 210,30 250,52 290,38 330,55 370,40" fill="none" stroke="#d4a843" stroke-width="2.5"/><line x1="10" y1="30" x2="370" y2="30" stroke="#d4a843" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/><line x1="10" y1="58" x2="370" y2="58" stroke="#d4a843" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/></svg>
<p>Precio oscila entre soporte y resistencia <strong style="color:var(--gold)">sin dirección</strong> ↔</p></div>
<div class="cbox"><div class="cbox-label">🔑 Regla de oro</div><p><strong>"La tendencia es tu amiga"</strong> — Opera siempre a favor de la tendencia dominante. Compra en alcistas, vende en bajistas. Operar contra tendencia es la causa #1 de pérdidas.</p></div>
<div class="ebox"><div class="ebox-label">📌 Identificar en 5 segundos</div><p>1. Abre gráfico H4 o D1<br>2. ¿Máximos cada vez más altos? → <strong style="color:var(--green)">Alcista</strong><br>3. ¿Mínimos cada vez más bajos? → <strong style="color:var(--red)">Bajista</strong><br>4. ¿Va y viene sin rumbo? → <strong style="color:var(--gold)">Lateral</strong></p></div>
`,q:{q:'¿Cómo se identifica una tendencia alcista?',o:['Mínimos decrecientes','Máximos y mínimos crecientes','Precio lateral','Volumen alto'],a:1}},

// ===== LESSON 4 =====
{id:4,t:'Soportes y Resistencias',s:'Los niveles más importantes que debes dominar',c:`
<div class="cb"><p>Son <strong>zonas de precio donde el mercado reacciona repetidamente</strong>. Son como muros invisibles que el precio respeta.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">🟢</div><div class="info-title">Soporte</div><div class="info-desc">Suelo donde el precio rebota al alza. Los compradores superan a vendedores.</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-icon">🔴</div><div class="info-title">Resistencia</div><div class="info-desc">Techo donde el precio rebota a la baja. Los vendedores superan a compradores.</div></div>
</div>
<div class="vbox"><div class="vbox-tag">S/R en acción</div>
<svg width="100%" height="160" viewBox="0 0 500 160">
<rect x="0" y="22" width="500" height="18" fill="rgba(231,76,60,0.06)" rx="3"/><line x1="0" y1="32" x2="500" y2="32" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="8,4"/>
<rect x="0" y="120" width="500" height="18" fill="rgba(46,204,113,0.06)" rx="3"/><line x1="0" y1="130" x2="500" y2="130" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="8,4"/>
<polyline points="20,128 55,80 85,34 115,65 145,127 180,75 215,35 250,80 285,126 320,70 355,36 390,85 430,125 465,90" fill="none" stroke="#d4a843" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="20" cy="128" r="6" fill="none" stroke="#2ecc71" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="145" cy="127" r="6" fill="none" stroke="#2ecc71" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin=".3s"/></circle>
<circle cx="285" cy="126" r="6" fill="none" stroke="#2ecc71" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin=".6s"/></circle>
<circle cx="85" cy="34" r="6" fill="none" stroke="#e74c3c" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin=".15s"/></circle>
<circle cx="215" cy="35" r="6" fill="none" stroke="#e74c3c" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin=".45s"/></circle>
<circle cx="355" cy="36" r="6" fill="none" stroke="#e74c3c" stroke-width="2"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin=".75s"/></circle>
</svg><p>Círculos pulsantes = puntos de rebote. Más rebotes = nivel más fuerte.</p></div>
<div class="cbox"><div class="cbox-label">💡 Cambio de polaridad</div><p>Cuando un <strong>soporte se rompe → se convierte en resistencia</strong>. Cuando una <strong>resistencia se rompe → se convierte en soporte</strong>. Este principio es fundamental.</p></div>
<div class="flow"><div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Busca rebotes múltiples</h4><p>Al menos 2 toques en la misma zona</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Usa zonas, no líneas exactas</h4><p>Los S/R son áreas de unos pocos pips</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">3</div><div class="flow-text"><h4>Prioriza timeframes mayores</h4><p>S/R en D1 es más fuerte que en M15</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">4</div><div class="flow-text"><h4>Busca confluencia</h4><p>S/R + EMA + Fibonacci + número redondo = nivel fortísimo</p></div></div></div>
`,q:{q:'¿Qué ocurre cuando un soporte se rompe?',o:['Desaparece','Se convierte en resistencia','Se hace más fuerte','El precio sube'],a:1}},

// ===== LESSON 5 =====
{id:5,t:'Medias Móviles (EMA y SMA)',s:'El indicador más usado por los profesionales',c:`
<div class="cb"><p>Una media móvil muestra el <strong>precio promedio</strong> durante un período. Suaviza el ruido y muestra la tendencia con claridad.</p></div>
<div class="vbox"><div class="vbox-tag">SMA vs EMA</div>
<table class="ctable"><tr><th></th><th>SMA (Simple)</th><th>EMA (Exponencial)</th></tr>
<tr><td>Cálculo</td><td>Promedio simple</td><td>Más peso a datos recientes</td></tr>
<tr><td>Velocidad</td><td>Más lenta</td><td>Más rápida</td></tr>
<tr><td>Señales falsas</td><td>Menos</td><td>Más</td></tr>
<tr><td>Mejor para</td><td>Tendencia general</td><td>Trading activo</td></tr></table></div>
<div class="info-grid info-grid-3">
<div class="info-card" style="border-top:3px solid var(--cyan)"><div class="info-title">EMA 20</div><div class="info-desc">Tendencia corto plazo</div></div>
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-title">EMA 50</div><div class="info-desc">Medio plazo. S/R dinámica</div></div>
<div class="info-card" style="border-top:3px solid var(--purple)"><div class="info-title">EMA 200</div><div class="info-desc">Largo plazo. La más importante</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Cruces clave</div><p><strong style="color:var(--green)">Golden Cross:</strong> EMA 50 cruza POR ENCIMA de EMA 200 → Señal alcista fuerte<br><strong style="color:var(--red)">Death Cross:</strong> EMA 50 cruza POR DEBAJO de EMA 200 → Señal bajista fuerte</p></div>
<div class="wbox"><div class="wbox-label">⚠️ Importante</div><p>Las medias móviles son indicadores <strong>retrasados</strong>. No predicen, confirman. Úsalas para confirmar tendencia, no como señal única de entrada.</p></div>
`,q:{q:'¿Qué indica un Golden Cross?',o:['Señal bajista','Precio en soporte','EMA 50 cruza por encima de EMA 200 (alcista)','Fin de tendencia'],a:2}},

// ===== LESSON 6 =====
{id:6,t:'RSI — Índice de Fuerza Relativa',s:'Sobrecompra, sobreventa y divergencias',c:`
<div class="cb"><p>El RSI mide la <strong>velocidad y magnitud</strong> de los movimientos. Se mueve entre 0 y 100.</p></div>
<div class="vbox"><div class="vbox-tag">Zonas del RSI</div>
<div style="border-radius:8px;overflow:hidden"><div style="background:rgba(231,76,60,0.08);padding:12px 16px;font-size:13px"><strong style="color:var(--red)">70-100: SOBRECOMPRA</strong> <span style="color:var(--text-3)">— Posible corrección bajista</span></div>
<div style="background:rgba(255,255,255,0.02);padding:12px 16px;font-size:13px"><strong style="color:var(--text-3)">30-70: ZONA NEUTRAL</strong> <span style="color:var(--text-3)">— Sin señal clara</span></div>
<div style="background:rgba(46,204,113,0.08);padding:12px 16px;font-size:13px"><strong style="color:var(--green)">0-30: SOBREVENTA</strong> <span style="color:var(--text-3)">— Posible rebote alcista</span></div></div></div>
<div class="cbox"><div class="cbox-label">💡 Divergencias (señal avanzada)</div><p><strong style="color:var(--green)">Div. alcista:</strong> Precio hace nuevos mínimos PERO RSI hace mínimos más altos → impulso bajista se agota<br><br><strong style="color:var(--red)">Div. bajista:</strong> Precio hace nuevos máximos PERO RSI hace máximos más bajos → impulso alcista se agota</p></div>
<div class="ebox"><div class="ebox-label">📌 Configuración recomendada</div><p>Período: <strong>14</strong> (estándar). En tendencia alcista el RSI se mueve entre 40-80. En bajista entre 20-60. Las divergencias son más útiles que las zonas de sobrecompra/sobreventa.</p></div>
`,q:{q:'¿Qué indica una divergencia alcista?',o:['El precio subirá seguro','RSI está en 70','Precio hace nuevos mínimos pero RSI hace mínimos más altos','Volumen sube'],a:2}},

// ===== LESSON 7 =====
{id:7,t:'MACD',s:'Confirma tendencias y detecta cambios de momentum',c:`
<div class="cb"><p>El MACD muestra la <strong>relación entre dos EMAs</strong>. Funciona como indicador de tendencia Y de momentum.</p></div>
<div class="info-grid info-grid-3">
<div class="info-card" style="border-top:3px solid var(--blue)"><div class="info-title">Línea MACD</div><div class="info-desc">EMA 12 − EMA 26</div></div>
<div class="info-card" style="border-top:3px solid var(--orange)"><div class="info-title">Signal</div><div class="info-desc">EMA 9 del MACD</div></div>
<div class="info-card" style="border-top:3px solid var(--text-3)"><div class="info-title">Histograma</div><div class="info-desc">MACD − Signal (momentum visual)</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Señales del MACD</div><p><strong style="color:var(--green)">Cruce alcista:</strong> MACD cruza por encima de Signal → Compra<br><strong style="color:var(--red)">Cruce bajista:</strong> MACD cruza por debajo de Signal → Venta<br><strong>Cruce línea cero:</strong> Confirma cambio de tendencia</p></div>
<div class="ebox"><div class="ebox-label">📌 Combo RSI + MACD</div><p>1. MACD > 0 y creciendo → Tendencia alcista confirmada<br>2. RSI retrocede a zona 40-50 → Espera rebote<br>3. Cruce alcista MACD + RSI saliendo de sobreventa → <strong>Entrada de alta probabilidad</strong></p></div>
`,q:{q:'¿Qué indica un cruce alcista del MACD?',o:['Vender','MACD cruza por encima de Signal','RSI en 70','Volumen baja'],a:1}},

// ===== LESSON 8 =====
{id:8,t:'Temporalidades (Timeframes)',s:'Multi-timeframe — ver el mercado completo',c:`
<div class="cb"><p>La temporalidad cambia tu perspectiva. El mismo instrumento puede parecer alcista en H1 y bajista en D1.</p></div>
<div class="vbox"><div class="vbox-tag">Temporalidades principales</div>
<table class="ctable"><tr><th>Timeframe</th><th>Estilo</th><th>Duración trades</th></tr>
<tr><td>M1-M5</td><td>Scalping</td><td>Segundos a minutos</td></tr>
<tr><td>M15-M30</td><td>Intraday</td><td>Minutos a horas</td></tr>
<tr><td>H1-H4</td><td>Swing corto</td><td>Horas a días</td></tr>
<tr><td>D1</td><td>Swing</td><td>Días a semanas</td></tr>
<tr><td>W1-MN</td><td>Posicional</td><td>Semanas a meses</td></tr></table></div>
<div class="cbox"><div class="cbox-label">💡 Análisis Multi-Timeframe</div><p>Usa siempre <strong>3 temporalidades</strong>:<br><strong>1. Mayor:</strong> Define sesgo (D1)<br><strong>2. Media:</strong> Estructura y S/R (H4)<br><strong>3. Menor:</strong> Entrada exacta (H1/M15)<br><br>Solo opera en dirección del TF mayor.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--cyan)"><div class="info-title">Scalper</div><div class="info-desc">H1 → M15 → M5</div></div>
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-title">Swing Trader</div><div class="info-desc">W1 → D1 → H4</div></div>
</div>
`,q:{q:'¿Para qué sirve el timeframe mayor?',o:['Entradas exactas','Definir sesgo direccional','Ver volumen','Contar velas'],a:1}},

// ===== LESSON 9 =====
{id:9,t:'Figuras Chartistas',s:'Triángulos, banderas, doble techo y suelo',c:`
<div class="cb"><p>Son <strong>patrones geométricos</strong> del precio que dan información sobre la dirección futura.</p></div>
<div class="vbox"><div class="vbox-tag">Doble Techo (Reversión bajista)</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,85 60,18 120,55 180,20 240,65 300,75 370,90" fill="none" stroke="#e74c3c" stroke-width="2.5"/><line x1="40" y1="18" x2="200" y2="18" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/><line x1="80" y1="55" x2="260" y2="55" stroke="#d4a843" stroke-width="1" stroke-dasharray="4,3"/><text x="265" y="53" fill="#d4a843" font-size="10" font-family="monospace">Neckline</text></svg>
<p>Precio toca resistencia 2 veces sin romper → cae al romper el neckline</p></div>
<div class="vbox"><div class="vbox-tag">Doble Suelo (Reversión alcista)</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,15 60,82 120,40 180,80 240,30 300,20 370,10" fill="none" stroke="#2ecc71" stroke-width="2.5"/><line x1="40" y1="82" x2="200" y2="82" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4,3"/><line x1="80" y1="40" x2="260" y2="40" stroke="#d4a843" stroke-width="1" stroke-dasharray="4,3"/><text x="265" y="38" fill="#d4a843" font-size="10" font-family="monospace">Neckline</text></svg>
<p>Precio toca soporte 2 veces sin romper → sube al romper el neckline</p></div>
<div class="vbox"><div class="vbox-tag">Triángulo simétrico</div>
<svg width="100%" height="100" viewBox="0 0 400 100"><polyline points="10,15 70,85 130,25 190,75 250,35 310,65 340,50" fill="none" stroke="#d4a843" stroke-width="2.5"/><line x1="10" y1="15" x2="340" y2="48" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/><line x1="10" y1="85" x2="340" y2="52" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4,3"/><polyline points="340,50 390,28" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-dasharray="6,3"/></svg>
<p>Precio comprime → la ruptura determina la dirección</p></div>
<div class="wbox"><div class="wbox-label">⚠️ Regla de oro</div><p><strong>Nunca anticipes la ruptura.</strong> Espera cierre fuera de la figura. Muchas figuras fallan. Opera la confirmación, no la predicción.</p></div>
`,q:{q:'¿Qué indica un doble techo?',o:['Continuación alcista','Posible reversión bajista','Mayor volatilidad','Tendencia lateral'],a:1}},

// ===== LESSON 10 =====
{id:10,t:'Volumen',s:'El combustible que mueve el precio',c:`
<div class="cb"><p>El volumen mide <strong>cuántas transacciones</strong> ocurren. Sin volumen, los movimientos son débiles.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-title">Precio ↑ Volumen ↑</div><div class="info-desc">Movimiento sano y fiable ✅</div></div>
<div class="info-card" style="border-top:3px solid var(--orange)"><div class="info-title">Precio ↑ Volumen ↓</div><div class="info-desc">Movimiento débil, posible agotamiento ⚠️</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-title">Precio ↓ Volumen ↑</div><div class="info-desc">Venta fuerte, presión real ✅</div></div>
<div class="info-card" style="border-top:3px solid var(--orange)"><div class="info-title">Precio ↓ Volumen ↓</div><div class="info-desc">Corrección sin convicción ⚠️</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Volumen en rupturas</div><p>Cuando el precio rompe un S/R, el volumen <strong>debe aumentar significativamente</strong>. Si rompe con volumen bajo → alta probabilidad de <strong>falsa ruptura</strong> (fakeout).</p></div>
<div class="wbox"><div class="wbox-label">⚠️ Nota sobre Forex</div><p>En Forex no hay volumen centralizado (es OTC). El "tick volume" de MT4/MT5 tiene correlación útil pero no es volumen real. Para volumen real usa futuros (CME).</p></div>
`,q:{q:'¿Qué sugiere precio subiendo con volumen bajando?',o:['Tendencia fuerte','Movimiento débil, posible agotamiento','Señal de compra','Mayor liquidez'],a:1}},

// ===== LESSON 11 =====
{id:11,t:'Gestión de Riesgo Básica',s:'Lo que separa ganadores de perdedores',c:`
<div class="cb"><p>La mejor estrategia sin gestión de riesgo = <strong>ruina garantizada</strong>. El riesgo no es opcional.</p></div>
<div class="cbox"><div class="cbox-label">🔑 La Regla del 1-2%</div><p>Nunca arriesgues más del <strong>1-2% de tu capital</strong> por operación. Con 1%, necesitarías 100 pérdidas seguidas para quebrar. Con 5%, solo 20.</p></div>
<div class="vbox"><div class="vbox-tag">Impacto del % de riesgo</div>
<table class="ctable"><tr><th>Riesgo/Op</th><th>10 pérdidas</th><th>20 pérdidas</th><th>Recuperación</th></tr>
<tr><td>1%</td><td>-9.6%</td><td>-18.2%</td><td style="color:var(--green)">22%</td></tr>
<tr><td>2%</td><td>-18.3%</td><td>-33.2%</td><td style="color:var(--gold)">50%</td></tr>
<tr><td>5%</td><td>-40.1%</td><td>-64.2%</td><td style="color:var(--red)">179%</td></tr>
<tr><td>10%</td><td>-65.1%</td><td>-87.8%</td><td style="color:var(--red)">724%</td></tr></table></div>
<div class="ebox"><div class="ebox-label">📌 Fórmula de tamaño de posición</div><p><strong>Lotes = (Capital × % Riesgo) ÷ (Distancia SL × Valor contrato)</strong><br><br>Ejemplo: $10.000 × 1% = $100 de riesgo. SL a 50 pips. Valor pip = $10.<br>Lotes = $100 ÷ (50 × $10) = <strong>0.20 lotes</strong></p></div>
<div class="cbox"><div class="cbox-label">💡 Ratio R:R mínimo</div><p>Busca siempre <strong>R:R mínimo 1:1.5</strong>, ideal <strong>1:2+</strong>. Con R:R 1:2 y win rate 40%, eres rentable a largo plazo. Las matemáticas trabajan a tu favor.</p></div>
`,q:{q:'¿Riesgo máximo recomendado por operación?',o:['5-10%','10-20%','1-2%','Sin límite si la señal es buena'],a:2}},

// ===== LESSON 12 =====
{id:12,t:'Tu Plan de Trading',s:'Cómo unir todo y operar con estructura',c:`
<div class="cb"><p>Un plan de trading es un <strong>documento escrito</strong> con tus reglas. Sin plan = adivinando. Con plan = ejecutando un sistema.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Mercados</h4><p>¿Qué instrumentos opero? (EUR/USD, XAU/USD...)</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Temporalidades</h4><p>¿Qué timeframes? (D1 tendencia, H4 estructura, H1 entrada)</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">3</div><div class="flow-text"><h4>Setup de entrada</h4><p>¿Qué condiciones para entrar? (S/R + EMA + RSI < 40)</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">4</div><div class="flow-text"><h4>Stop Loss y Take Profit</h4><p>¿Dónde SL? ¿Dónde TP? (Bajo swing low, próxima resistencia)</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">5</div><div class="flow-text"><h4>Gestión de riesgo</h4><p>1% riesgo, máx 3 operaciones abiertas</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">6</div><div class="flow-text"><h4>Horarios y reglas de pausa</h4><p>Sesión Londres-NY. 3 pérdidas seguidas = paro</p></div></div>
</div>
<div class="ebox"><div class="ebox-label">✅ Checklist antes de cada operación</div><p>✅ ¿Tendencia del TF mayor apoya mi dirección?<br>✅ ¿Tengo al menos 2 confluencias?<br>✅ ¿R:R mínimo 1:1.5?<br>✅ ¿Riesgo ≤ 2% del capital?<br>✅ ¿No hay noticias de alto impacto?<br>✅ ¿Estado emocional estable?<br><br><strong>Si alguna es NO → NO ENTRES</strong></p></div>
<div class="cb"><h3>🎓 ¡Felicidades!</h3><p>Ahora tienes las bases del análisis técnico. El conocimiento sin práctica no sirve. Abre tu plataforma, aplica en <strong>cuenta demo</strong> primero, y lleva un diario de trading. Para más, explora nuestras <a href="../../index.html" style="color:var(--gold)">herramientas</a> y cursos avanzados.</p></div>
`,q:{q:'¿Cuántas confluencias mínimas para entrar?',o:['Ninguna, basta el instinto','1','Al menos 2','5 o más'],a:2}}
];

let cur=0,done=new Set();
try{const s=localStorage.getItem('c-at');if(s)done=new Set(JSON.parse(s))}catch(e){}

function renderSB(){
const n=document.getElementById('sbNav');
n.innerHTML=L.map((l,i)=>`<button class="sb-link ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="go(${i})"><span class="sb-num">${done.has(i)?'✓':l.id}</span><span>${l.t}</span></button>`).join('');
document.getElementById('progText').textContent=done.size+'/'+L.length;
document.getElementById('progFill').style.width=(done.size/L.length*100)+'%';
}

function render(){
const l=L[cur],m=document.getElementById('mainArea');
let qh='';
if(l.q)qh=`<div class="quiz-box"><div class="quiz-q">🧠 ${l.q.q}</div><div class="quiz-opts">${l.q.o.map((o,i)=>`<button class="qo" onclick="chk(${i},${l.q.a})">${o}</button>`).join('')}</div><div class="quiz-fb" id="qfb"></div></div>`;
m.innerHTML=`<div class="lesson-tag">Lección ${l.id} de ${L.length}</div><h1 class="lesson-title">${l.t}</h1><p class="lesson-sub">${l.s}</p>${l.c}${qh}<div class="lesson-nav">${cur>0?`<button class="ln-btn ln-prev" onclick="go(${cur-1})">← Anterior</button>`:'<div></div>'}${cur<L.length-1?`<button class="ln-btn ln-next" onclick="cmpNext()">Completar y seguir →</button>`:`<button class="ln-btn ln-done" onclick="finish()">🎓 Completar curso</button>`}</div>`;
m.scrollTo(0,0);window.scrollTo(0,0);renderSB();
document.getElementById('sidebar').classList.remove('open');
qAns=false;
}

let qAns=false;
function chk(s,c){if(qAns)return;qAns=true;document.querySelectorAll('.qo').forEach((b,i)=>{if(i===c)b.classList.add('ok');else if(i===s&&s!==c)b.classList.add('no');b.style.cursor='default'});document.getElementById('qfb').innerHTML=s===c?'<span style="color:var(--green)">✅ ¡Correcto!</span>':'<span style="color:var(--red)">❌ Incorrecto</span>'}

function go(i){cur=i;render()}
function cmpNext(){done.add(cur);save();go(cur+1)}
function save(){try{localStorage.setItem('c-at',JSON.stringify([...done]))}catch(e){}}
function finish(){done.add(cur);save();const m=document.getElementById('mainArea');m.innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:72px;margin-bottom:16px">🎓</div><h1 style="font-size:30px;font-weight:900;margin-bottom:10px">¡Curso Completado!</h1><p style="font-size:16px;color:var(--text-2);margin-bottom:6px">${L.length} lecciones de Análisis Técnico completadas</p><p style="font-size:14px;color:var(--gold);font-weight:600;margin-bottom:28px">${done.size}/${L.length} completadas</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a href="../../index.html" class="ln-btn ln-next" style="text-decoration:none;display:inline-block">Herramientas →</a><a href="../cursos.html" class="ln-btn ln-prev" style="text-decoration:none;display:inline-block">Más cursos</a></div></div>`;renderSB()}

render();
</script>
</body>
</html>

const L=[
{id:1,t:'¿Qué Hace una Buena Estrategia?',s:'Los componentes de un sistema rentable',c:`
<div class="cb"><p>Una estrategia de trading es un <strong>conjunto de reglas objetivas</strong> que definen cuándo entrar, cuándo salir y cuánto arriesgar. Si no puedes escribirla en una hoja, no es una estrategia — es improvisación.</p></div>
<div class="info-grid info-grid-3">
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-icon">🎯</div><div class="info-title">Entrada clara</div><div class="info-desc">Condiciones exactas y no ambiguas para abrir posición</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-icon">🛑</div><div class="info-title">Salida definida</div><div class="info-desc">SL y TP predefinidos antes de entrar</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📐</div><div class="info-title">Riesgo controlado</div><div class="info-desc">Position sizing y máximo de operaciones</div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Test de objetividad</div><p>Tu estrategia es objetiva si <strong>dos personas diferentes</strong> mirando el mismo gráfico tomarían la misma decisión. Si depende de "feeling" o "intuición", no está lista.</p></div>
<div class="vbox"><div class="vbox-tag">Las 3 estrategias que aprenderás</div>
<table class="ctable"><tr><th>Estrategia</th><th>Estilo</th><th>TF</th><th>Complejidad</th></tr>
<tr><td>EMA Bounce</td><td>Swing</td><td>H4/D1</td><td style="color:var(--green)">Baja</td></tr>
<tr><td>Breakout + Retest</td><td>Intraday/Swing</td><td>H1/H4</td><td style="color:var(--gold)">Media</td></tr>
<tr><td>Multi-Confluencia</td><td>Swing</td><td>H4/D1</td><td style="color:var(--orange)">Alta</td></tr></table></div>
`,q:{q:'¿Qué define una estrategia objetiva?',o:['Depende de la intuición','Usa muchos indicadores','Dos personas tomarían la misma decisión','Tiene un win rate del 100%'],a:2}},

{id:2,t:'Estrategia 1: EMA Bounce',s:'Simple, elegante y efectiva',c:`
<div class="strat-badge" style="background:rgba(46,204,113,0.1);color:var(--green)">Estrategia 1 — Nivel principiante</div>
<div class="cb"><p>La estrategia más simple y fiable para empezar. Se basa en comprar retrocesos a la EMA en tendencias claras. Solo necesitas <strong>2 indicadores</strong>.</p></div>
<div class="vbox"><div class="vbox-tag">Setup del gráfico</div>
<table class="ctable"><tr><th>Elemento</th><th>Configuración</th></tr>
<tr><td>Temporalidad tendencia</td><td>D1</td></tr>
<tr><td>Temporalidad entrada</td><td>H4</td></tr>
<tr><td>Indicador 1</td><td>EMA 50 (amarilla)</td></tr>
<tr><td>Indicador 2</td><td>RSI 14</td></tr>
<tr><td>Pares recomendados</td><td>EUR/USD, GBP/USD, XAU/USD</td></tr></table></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Confirma la tendencia en D1</h4><p>Precio por encima de EMA 50 = solo compras. Por debajo = solo ventas.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Espera retroceso a la EMA 50 en H4</h4><p>El precio debe tocar o acercarse a la EMA 50 (dentro de 10 pips).</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">3</div><div class="flow-text"><h4>Confirma con RSI</h4><p>Para compras: RSI debe estar entre 35-50 (retrocedido pero no roto). Para ventas: RSI entre 50-65.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">4</div><div class="flow-text"><h4>Confirma con vela</h4><p>Espera una vela de rechazo en la EMA: Hammer, Engulfing, o Pin Bar.</p></div></div>
</div>
<div class="ebox"><div class="ebox-label">📌 Reglas de salida</div><p><strong>Stop Loss:</strong> Debajo del último swing low (compras) o encima del swing high (ventas) + 5 pips buffer<br><strong>Take Profit 1:</strong> R:R 1:1.5 — cierra 50% de la posición<br><strong>Take Profit 2:</strong> R:R 1:3 — cierra el resto o mueve SL a breakeven</p></div>
<div class="cbox"><div class="cbox-label">💡 Filtros — NO operar cuando</div><p>❌ El precio está lejos de la EMA (ya subió demasiado)<br>❌ Hay noticias de alto impacto en las próximas 2 horas<br>❌ El RSI no confirmó (está por encima de 50 en compras)</p></div>
`,q:{q:'¿Cuándo compras en la estrategia EMA Bounce?',o:['Cuando el RSI está en 80','Cuando el precio toca la EMA 50 con RSI 35-50 y vela de rechazo','Cuando hay noticias','Cuando el precio está lejos de la EMA'],a:1}},

{id:3,t:'EMA Bounce: Ejemplos',s:'Operaciones reales paso a paso',c:`
<div class="cb"><h3>Ejemplo 1: Compra EUR/USD</h3></div>
<div class="vbox"><div class="vbox-tag">Setup de compra</div>
<svg width="100%" height="160" viewBox="0 0 500 160">
<line x1="0" y1="80" x2="500" y2="55" stroke="#d4a843" stroke-width="2" stroke-dasharray="5,3"/>
<text x="460" y="48" fill="#d4a843" font-size="10" font-family="monospace">EMA 50</text>
<polyline points="20,50 60,45 100,42 140,55 180,65 220,72 240,78 260,60 300,48 340,42 380,38 420,35 460,30" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
<circle cx="240" cy="78" r="8" fill="none" stroke="#d4a843" stroke-width="2.5"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
<text x="248" y="95" fill="#d4a843" font-size="10" font-family="monospace">Entrada aquí</text>
<line x1="240" y1="90" x2="240" y2="105" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="245" y="115" fill="#e74c3c" font-size="9" font-family="monospace">SL</text>
<line x1="380" y1="38" x2="380" y2="25" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="385" y="22" fill="#2ecc71" font-size="9" font-family="monospace">TP</text>
</svg>
<p>El precio retrocede a la EMA 50, forma un Hammer, RSI en 42 → Entrada con R:R 1:2.5</p></div>
<div class="ebox"><div class="ebox-label">📌 Resultado</div><p>✅ Tendencia D1: Alcista (precio sobre EMA 50)<br>✅ Retroceso a EMA 50 en H4: Sí<br>✅ RSI: 42 (zona 35-50)<br>✅ Vela: Hammer con mecha inferior larga<br>✅ R:R: 1:2.5<br><br><strong>Trade ejecutado → TP alcanzado</strong></p></div>
<div class="wbox"><div class="wbox-label">⚠️ Ejemplo de NO operar</div><p>Mismo par, pero RSI está en 62 cuando toca la EMA → <strong>Filtro RSI no confirmado</strong>. El precio ya ha rebotado mucho. No entres — espera el próximo retroceso real.</p></div>
`,q:{q:'En el ejemplo, ¿qué confirmó la entrada?',o:['Solo la EMA','EMA + RSI en zona + vela de rechazo','Un indicador secreto','Noticias fundamentales'],a:1}},

{id:4,t:'Estrategia 2: Breakout + Retest',s:'Captura movimientos explosivos',c:`
<div class="strat-badge" style="background:rgba(52,152,219,0.1);color:var(--blue)">Estrategia 2 — Nivel intermedio</div>
<div class="cb"><p>Esta estrategia captura <strong>rupturas de niveles clave</strong> esperando la confirmación del retest. Evita entrar en la ruptura directa (muchas son falsas) y entra cuando el nivel roto se confirma.</p></div>
<div class="vbox"><div class="vbox-tag">El concepto: Breakout + Retest</div>
<svg width="100%" height="160" viewBox="0 0 500 160">
<line x1="0" y1="70" x2="500" y2="70" stroke="#d4a843" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="5" y="62" fill="#d4a843" font-size="10" font-family="monospace">Resistencia → Soporte</text>
<polyline points="20,100 60,85 100,72 130,90 160,85 200,72 230,55 250,40 270,50 300,65 310,72 330,60 360,50 400,40 440,30" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
<circle cx="230" cy="55" r="6" fill="none" stroke="#e67e22" stroke-width="2"/>
<text x="235" y="48" fill="#e67e22" font-size="9" font-family="monospace">Breakout</text>
<circle cx="310" cy="72" r="8" fill="none" stroke="#d4a843" stroke-width="2.5"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
<text x="318" y="88" fill="#d4a843" font-size="10" font-family="monospace">Retest = Entrada</text>
</svg>
<p>El precio rompe la resistencia → retrocede a testearla como soporte → confirma y continúa</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Identifica un nivel clave de S/R</h4><p>Nivel con al menos 2-3 toques previos en H4/D1</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">2</div><div class="flow-text"><h4>Espera la ruptura con volumen</h4><p>El precio debe cerrar FUERA del nivel con una vela de cuerpo grande</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">3</div><div class="flow-text"><h4>Espera el retest</h4><p>El precio vuelve a tocar el nivel roto. La resistencia ahora es soporte (o viceversa)</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">4</div><div class="flow-text"><h4>Entra con confirmación</h4><p>Vela de rechazo en el retest (Hammer, Engulfing, Pin Bar). No entres a ciegas.</p></div></div>
</div>
<div class="ebox"><div class="ebox-label">📌 Reglas de salida</div><p><strong>SL:</strong> Al otro lado del nivel retesteado + buffer<br><strong>TP1:</strong> Próximo nivel de S/R (cierra 50%)<br><strong>TP2:</strong> Extensión Fibonacci 127.2% del rango previo</p></div>
<div class="cbox"><div class="cbox-label">💡 Por qué funciona el retest</div><p>Cuando un nivel se rompe, muchos traders que estaban en la dirección equivocada cierran sus posiciones en el retest (minimizando pérdidas). Esto crea una oleada de órdenes que empuja el precio en la nueva dirección. Es oferta y demanda pura.</p></div>
`,q:{q:'¿Cuándo entras en la estrategia Breakout + Retest?',o:['En el momento de la ruptura','Cuando el precio retestea el nivel roto con confirmación','Antes de la ruptura','Cuando el RSI está en 50'],a:1}},

{id:5,t:'Breakout + Retest: Filtros',s:'Evitar las falsas rupturas',c:`
<div class="cb"><p>El mayor enemigo de esta estrategia son las <strong>falsas rupturas</strong> (fakeouts). Estos filtros te protegen.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📊</div><div class="info-title">Volumen alto</div><div class="info-desc">La vela de ruptura debe tener volumen significativamente mayor al promedio</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📏</div><div class="info-title">Cuerpo grande</div><div class="info-desc">La vela que rompe debe cerrar con un cuerpo grande, no solo la mecha</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">📈</div><div class="info-title">Tendencia a favor</div><div class="info-desc">Rupturas a favor de la tendencia mayor son más fiables</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">⏰</div><div class="info-title">Sesión activa</div><div class="info-desc">Rupturas en Londres o NY son más fiables que en Asia</div></div>
</div>
<div class="wbox"><div class="wbox-label">⚠️ Señales de falsa ruptura</div><p>❌ Ruptura con mecha larga y cuerpo pequeño<br>❌ Ruptura contra la tendencia mayor<br>❌ Ruptura en sesión asiática con bajo volumen<br>❌ Ruptura justo antes de noticias de alto impacto<br>❌ El precio vuelve dentro del nivel inmediatamente</p></div>
`,q:{q:'¿Cuál es la señal más clara de una falsa ruptura?',o:['Volumen alto','Cuerpo de vela grande','Ruptura con mecha larga y cuerpo pequeño','Se produce en sesión Londres'],a:2}},

{id:6,t:'Estrategia 3: Multi-Confluencia',s:'El enfoque del trader profesional',c:`
<div class="strat-badge" style="background:rgba(155,89,182,0.1);color:var(--purple)">Estrategia 3 — Nivel avanzado</div>
<div class="cb"><p>Esta estrategia usa <strong>múltiples factores alineados</strong> para encontrar setups de altísima probabilidad. No opera mucho, pero cuando opera, la probabilidad está fuertemente a su favor.</p></div>
<div class="cbox"><div class="cbox-label">💡 Regla: Mínimo 3 confluencias</div><p>Solo entra cuando al menos <strong>3 de estos factores</strong> coinciden en la misma zona de precio:</p></div>
<div class="info-grid info-grid-3">
<div class="info-card" style="border-top:3px solid var(--gold)"><div class="info-icon">📍</div><div class="info-title">S/R horizontal</div><div class="info-desc">Nivel con múltiples rebotes</div></div>
<div class="info-card" style="border-top:3px solid var(--blue)"><div class="info-icon">📐</div><div class="info-title">Fibonacci 50-61.8%</div><div class="info-desc">Zona dorada de retroceso</div></div>
<div class="info-card" style="border-top:3px solid var(--cyan)"><div class="info-icon">〰️</div><div class="info-title">EMA 50 o 200</div><div class="info-desc">S/R dinámica respetada</div></div>
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">🕯️</div><div class="info-title">Patrón de vela</div><div class="info-desc">Hammer, Engulfing, Star</div></div>
<div class="info-card" style="border-top:3px solid var(--orange)"><div class="info-icon">📊</div><div class="info-title">RSI divergencia</div><div class="info-desc">Divergencia en la zona clave</div></div>
<div class="info-card" style="border-top:3px solid var(--purple)"><div class="info-icon">🔢</div><div class="info-title">Número redondo</div><div class="info-desc">1.0800, 1.1000, etc.</div></div>
</div>
<div class="ebox"><div class="ebox-label">📌 Ejemplo: Setup 5 confluencias</div><p>XAU/USD en H4. Precio retrocede a zona de 2.340:<br>✅ Soporte horizontal (3 rebotes previos)<br>✅ Fibonacci 61.8% del último impulso<br>✅ EMA 50 pasa por 2.338<br>✅ RSI con divergencia alcista<br>✅ Se forma un Engulfing Alcista<br><br><strong>5 confluencias = setup A+. Máxima confianza.</strong></p></div>
`,q:{q:'¿Cuántas confluencias mínimas necesita esta estrategia?',o:['1','2','3','5'],a:2}},

{id:7,t:'Multi-Confluencia: Proceso',s:'El workflow paso a paso',c:`
<div class="cb"><h3>Rutina de análisis</h3><p>Sigue este proceso cada día para encontrar setups de confluencia.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Análisis top-down (10 min)</h4><p>D1 → H4: identifica tendencia y niveles clave. Marca zonas de interés.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Traza Fibonacci (5 min)</h4><p>En el último impulso relevante en H4. Marca la zona 50-61.8%.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">3</div><div class="flow-text"><h4>Verifica EMAs (2 min)</h4><p>¿La EMA 50 o 200 pasa por alguna de tus zonas de interés?</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">4</div><div class="flow-text"><h4>Cuenta confluencias (1 min)</h4><p>¿Cuántos factores se alinean en la misma zona? Necesitas mínimo 3.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">5</div><div class="flow-text"><h4>Espera al precio + vela (paciencia)</h4><p>Si el precio llega a tu zona, espera confirmación con vela de rechazo.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">6</div><div class="flow-text"><h4>Ejecuta con plan</h4><p>Entry, SL, TP predefinidos. R:R mínimo 1:2. No improvisar.</p></div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Paciencia = ventaja</div><p>Esta estrategia puede darte solo <strong>2-5 operaciones por semana</strong>. Eso es normal y es su fuerza. Menos operaciones + mayor probabilidad = más rentabilidad con menos estrés.</p></div>
`,q:{q:'¿Cuántas operaciones por semana esperar con esta estrategia?',o:['20-30','10-15','2-5','50+'],a:2}},

{id:8,t:'Backtesting',s:'Cómo validar una estrategia antes de arriesgar dinero real',c:`
<div class="cb"><p>Nunca operes una estrategia sin haberla testeado primero. El backtesting te dice si tu sistema es rentable <strong>antes</strong> de poner dinero real.</p></div>
<div class="vbox"><div class="vbox-tag">Métricas que debes calcular</div>
<table class="ctable"><tr><th>Métrica</th><th>Objetivo mínimo</th><th>Excelente</th></tr>
<tr><td>Win Rate</td><td>&gt;35% (con R:R 1:2)</td><td>&gt;50%</td></tr>
<tr><td>Profit Factor</td><td>&gt;1.3</td><td>&gt;2.0</td></tr>
<tr><td>Expectancia ($)</td><td>Positiva</td><td>&gt;$15/trade</td></tr>
<tr><td>Máx Drawdown</td><td>&lt;25%</td><td>&lt;15%</td></tr>
<tr><td>R:R medio</td><td>&gt;1:1.5</td><td>&gt;1:2</td></tr>
<tr><td>Muestra mínima</td><td>50 trades</td><td>100+ trades</td></tr></table></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Define reglas escritas</h4><p>Escribe CADA regla de tu estrategia antes de empezar</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Retrocede 6-12 meses</h4><p>En tu plataforma, ve al histórico del par elegido</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">3</div><div class="flow-text"><h4>Avanza vela a vela</h4><p>Simula en tiempo real. Cuando veas un setup, regístralo</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">4</div><div class="flow-text"><h4>Registra TODO</h4><p>Entry, SL, TP, resultado, R:R de CADA operación</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">5</div><div class="flow-text"><h4>Calcula métricas</h4><p>Con 50+ operaciones, calcula las métricas de la tabla</p></div></div>
</div>
<div class="wbox"><div class="wbox-label">⚠️ Errores de backtesting</div><p><strong>Sobreoptimización:</strong> No ajustes los parámetros hasta que "funcionen" en el pasado. Eso es curve fitting.<br><strong>Muestra pequeña:</strong> 10 operaciones no prueban nada. Necesitas mínimo 50.<br><strong>Sesgo de confirmación:</strong> No ignores los setups perdedores. Regístralos todos.</p></div>
`,q:{q:'¿Cuál es la muestra mínima para validar una estrategia?',o:['5 trades','10 trades','50 trades','500 trades'],a:2}},

{id:9,t:'Forward Testing',s:'Del backtesting al mercado real',c:`
<div class="cb"><p>Después del backtesting, el siguiente paso es el <strong>forward testing en demo</strong>. Operas en tiempo real pero sin dinero real. Esto te prepara para la presión emocional.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">1</div><div class="flow-text"><h4>Abre cuenta demo</h4><p>Con el mismo capital que usarás en real. Mismo broker, misma plataforma.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">2</div><div class="flow-text"><h4>Opera 4-8 semanas</h4><p>Sigue tus reglas al pie de la letra. Sin excepciones.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">3</div><div class="flow-text"><h4>Compara con backtest</h4><p>¿Los resultados son similares? Si sí, la estrategia es consistente.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">4</div><div class="flow-text"><h4>Pasa a real con tamaño mínimo</h4><p>Empieza con el lote más pequeño posible. Sube gradualmente.</p></div></div>
</div>
<div class="cbox"><div class="cbox-label">💡 Criterios para pasar a real</div><p>✅ Backtest de 50+ trades con profit factor >1.3<br>✅ Forward test de 4+ semanas con resultados consistentes<br>✅ Has seguido tu plan en >90% de las operaciones<br>✅ Te sientes cómodo emocionalmente con las pérdidas<br><br>Si no cumples TODO → sigue en demo. No hay prisa.</p></div>
<div class="info-grid">
<div class="info-card" style="border-top:3px solid var(--green)"><div class="info-icon">🐢</div><div class="info-title">Escalado gradual</div><div class="info-desc">Semana 1-2: 0.01 lotes. Semana 3-4: 0.02. Sube solo si eres rentable.</div></div>
<div class="info-card" style="border-top:3px solid var(--red)"><div class="info-icon">🚫</div><div class="info-title">Error fatal</div><div class="info-desc">Pasar de demo a lotes grandes. El shock emocional destruye la disciplina.</div></div>
</div>
`,q:{q:'¿Cuánto tiempo mínimo debes hacer forward testing?',o:['1 día','1 semana','4-8 semanas','1 año'],a:2}},

{id:10,t:'Tu Hoja de Ruta',s:'El camino del trader: de principiante a consistente',c:`
<div class="cb"><h3>🎓 Resumen del curso</h3><p>Tienes 3 estrategias probadas. Ahora necesitas un plan de acción claro para implementarlas.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot fd-gold">📚</div><div class="flow-text"><h4>Mes 1: Elige UNA estrategia</h4><p>No las mezcles. Empieza con EMA Bounce (la más simple). Domínala antes de pasar a la siguiente.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-gold">📊</div><div class="flow-text"><h4>Mes 1-2: Backtesting</h4><p>50+ operaciones en 2-3 pares. Registra métricas. ¿Es rentable? Si no, ajusta filtros.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-blue">📝</div><div class="flow-text"><h4>Mes 2-3: Forward test en demo</h4><p>Opera en tiempo real sin dinero. 4-8 semanas mínimo. Lleva diario.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">💰</div><div class="flow-text"><h4>Mes 3-4: Real con lote mínimo</h4><p>Empieza con 0.01 lotes. Sube gradualmente solo si eres consistente.</p></div></div>
<div class="flow-step"><div class="flow-dot fd-green">📈</div><div class="flow-text"><h4>Mes 6+: Escala y añade estrategias</h4><p>Cuando domines la primera, añade la segunda. Nunca dejes de llevar diario.</p></div></div>
</div>
<div class="vbox"><div class="vbox-tag">Comparativa de las 3 estrategias</div>
<table class="ctable"><tr><th></th><th>EMA Bounce</th><th>Breakout+Retest</th><th>Multi-Confluencia</th></tr>
<tr><td>Dificultad</td><td style="color:var(--green)">Baja</td><td style="color:var(--gold)">Media</td><td style="color:var(--orange)">Alta</td></tr>
<tr><td>Frecuencia</td><td>5-8/semana</td><td>3-5/semana</td><td>2-4/semana</td></tr>
<tr><td>Win Rate típico</td><td>45-55%</td><td>40-50%</td><td>55-65%</td></tr>
<tr><td>R:R típico</td><td>1:1.5-2</td><td>1:2-3</td><td>1:2-3</td></tr>
<tr><td>Mejor para</td><td>Principiantes</td><td>Intermedios</td><td>Avanzados</td></tr></table></div>
<div class="cbox"><div class="cbox-label">🔑 La verdad final</div><p>No existe la estrategia perfecta. Existe la estrategia que <strong>tú ejecutas con disciplina</strong>. El 80% del éxito es seguir las reglas. El 20% es la estrategia en sí. La consistencia gana siempre.</p></div>
<div class="ebox"><div class="ebox-label">🎯 Tus herramientas</div><p>Usa las herramientas de <a href="../../index.html" style="color:var(--gold)">Zona Trading Pro</a> para tu operativa:<br>• Calculadora de Posición → tamaño de lote<br>• Calculadora de Fibonacci → niveles de retroceso<br>• Simulador de Drawdown → prueba tu riesgo<br>• Quiz de Velas → practica patrones</p></div>
`,q:{q:'¿Qué porcentaje del éxito depende de la disciplina vs la estrategia?',o:['50/50','20% disciplina / 80% estrategia','80% disciplina / 20% estrategia','100% estrategia'],a:2}}
];
let cur=0,done=new Set();try{const s=localStorage.getItem('c-et');if(s)done=new Set(JSON.parse(s))}catch(e){}
function renderSB(){const n=document.getElementById('sbNav');n.innerHTML=L.map((l,i)=>`<button class="sb-link ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="go(${i})"><span class="sb-num">${done.has(i)?'✓':l.id}</span><span>${l.t}</span></button>`).join('');document.getElementById('progText').textContent=done.size+'/'+L.length;document.getElementById('progFill').style.width=(done.size/L.length*100)+'%'}
function render(){const l=L[cur],m=document.getElementById('mainArea');let qh='';if(l.q)qh=`<div class="quiz-box"><div class="quiz-q">🧠 ${l.q.q}</div><div class="quiz-opts">${l.q.o.map((o,i)=>`<button class="qo" onclick="chk(${i},${l.q.a})">${o}</button>`).join('')}</div><div class="quiz-fb" id="qfb"></div></div>`;m.innerHTML=`<div class="lesson-tag">Lección ${l.id} de ${L.length}</div><h1 class="lesson-title">${l.t}</h1><p class="lesson-sub">${l.s}</p>${l.c}${qh}<div class="lesson-nav">${cur>0?`<button class="ln-btn ln-prev" onclick="go(${cur-1})">← Anterior</button>`:'<div></div>'}${cur<L.length-1?`<button class="ln-btn ln-next" onclick="cmpNext()">Completar y seguir →</button>`:`<button class="ln-btn ln-done" onclick="finish()">🎓 Completar curso</button>`}</div>`;m.scrollTo(0,0);window.scrollTo(0,0);renderSB();document.getElementById('sidebar').classList.remove('open');qAns=false}
let qAns=false;function chk(s,c){if(qAns)return;qAns=true;document.querySelectorAll('.qo').forEach((b,i)=>{if(i===c)b.classList.add('ok');else if(i===s&&s!==c)b.classList.add('no');b.style.cursor='default'});document.getElementById('qfb').innerHTML=s===c?'<span style="color:var(--green)">✅ ¡Correcto!</span>':'<span style="color:var(--red)">❌ Incorrecto</span>'}
function go(i){cur=i;render()}function cmpNext(){done.add(cur);save();go(cur+1)}function save(){try{localStorage.setItem('c-et',JSON.stringify([...done]))}catch(e){}}
function finish(){done.add(cur);save();document.getElementById('mainArea').innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:72px;margin-bottom:16px">⚡</div><h1 style="font-size:30px;font-weight:900;margin-bottom:10px">¡Curso Completado!</h1><p style="font-size:16px;color:var(--text-2)">Tienes 3 estrategias listas para implementar</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px"><a href="../../index.html" class="ln-btn ln-next" style="text-decoration:none;display:inline-block">Herramientas →</a><a href="../cursos.html" class="ln-btn ln-prev" style="text-decoration:none;display:inline-block">Más cursos</a></div></div>`;renderSB()}
render();
</script>
</body>
